name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/lumin-meta-platform-v1
      - feat/connection-fabric-wave0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # The complete Vitest suite includes provider-contract and media tests and
    # can exceed fifteen minutes on a hosted runner. Keep one bounded job so a
    # timeout cannot be mistaken for a green partial certificate.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Install ffmpeg (video keyframe tests)
        run: |
          # ubuntu-latest normally includes ffmpeg. Avoid an unbounded apt wait
          # when a hosted image's package manager is temporarily unavailable.
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version >/dev/null
          else
            timeout --signal=TERM 180s sudo apt-get update \
              -o Dir::Etc::sourceparts="-" \
              -o Dir::Etc::sourcelist="/etc/apt/sources.list.d/ubuntu.sources"
            timeout --signal=TERM 180s sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Test
        env:
          CI: '1'
          FFMPEG_REQUIRED: '1'
        run: npm test

      - name: Build
        run: npm run build

  secret-scan:
    name: gitleaks (secret scan)
    # Required check: the job must always run so it can report a
    # status. Skip only the inner steps for fork PRs, where GitHub
    # withholds org secrets (GITLEAKS_LICENSE) and gitleaks-action
    # aborts before scanning. Push to main and PRs from internal
    # branches scan normally. Fork contributions are still covered
    # by maintainers running pre-deploy-guard locally on the
    # merged result.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip notice (fork PR)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "Skipping gitleaks scan — PR from fork (org secrets unavailable). Push to main will re-scan."

      - name: Checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          fetch-depth: 0

      # Single source of truth for the scanner version, shared with the local
      # guard in .github/pre-deploy-guard/. Left unpinned, the action supplies
      # its own default (8.24.3), which drifts from whatever contributors have
      # installed — and gitleaks versions genuinely disagree about allowlist
      # semantics, so a green local scan stopped predicting CI.
      - name: Resolve pinned gitleaks version
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          version="$(tr -d '[:space:]' < .gitleaks-version)"
          # .gitleaks-version is checked-out repo content, so treat it as
          # untrusted before it reaches GITHUB_ENV: anything but a bare
          # x.y.z could smuggle extra variables into the job environment.
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::.gitleaks-version must contain a bare semver (got: $version)"
            exit 1
          fi
          echo "GITLEAKS_VERSION=$version" >> "$GITHUB_ENV"

      - name: Run gitleaks
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: ${{ env.GITLEAKS_VERSION }}

  docker:
    name: Linux Docker build and credential-waiting smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Build image
        run: docker build --pull --tag lumin-meta-platform:${{ github.sha }} .

      - name: Verify image contents and runtime identity
        run: |
          test "$(docker run --rm lumin-meta-platform:${{ github.sha }} id -u)" = "1000"
          docker run --rm lumin-meta-platform:${{ github.sha }} node --version
          docker run --rm lumin-meta-platform:${{ github.sha }} ffmpeg -version >/dev/null
          docker run --rm lumin-meta-platform:${{ github.sha }} ffprobe -version >/dev/null
          secret_files="$(docker run --rm lumin-meta-platform:${{ github.sha }} sh -c 'find /app -type f \( -name ".env" -o -name "*.key" -o -name "*.pem" \) -print')"
          test -z "$secret_files"

      - name: Credential-waiting health smoke
        run: |
          docker run --detach --name lumin-meta-platform-smoke --publish 3000:3000 \
            --env DEPLOYMENT_MODE=awaiting_credentials \
            --env NODE_ENV=production \
            lumin-meta-platform:${{ github.sha }}
          trap 'docker logs lumin-meta-platform-smoke; docker rm --force lumin-meta-platform-smoke' EXIT
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Running}}' lumin-meta-platform-smoke 2>/dev/null)" != "true" ]; then
              echo "credential-waiting container exited before health became available"
              docker logs lumin-meta-platform-smoke
              exit 1
            fi
            health="$(curl --silent --show-error --http1.1 http://127.0.0.1:3000/health || true)"
            if [ "$health" = '{"status":"ok","state":"awaiting_credentials","metaConnected":false}' ]; then
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/mcp)" = "503"
              exit 0
            fi
            sleep 1
          done
          exit 1

  security-migration:
    name: Token encryption migration security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Crypto and keyring tests
        run: npx vitest run tests/auth/crypto.test.ts tests/auth/keyring.test.ts tests/auth/token-key-migration.test.ts

